[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
